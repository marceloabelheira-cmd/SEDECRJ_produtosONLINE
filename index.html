<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos SEDEC-RJ</title>
<style>

  :root{
    /* Cores fixas de marca — não mudam entre tema claro/escuro (faixa institucional, selos numerados) */
    --brand-navy-1:#0b2545;
    --brand-navy-2:#16406f;

    --blue-900:#0b2545;
    --blue-800:#0f2f57;
    --blue-700:#16406f;
    --blue-600:#1c5490;
    --blue-100:#e8eff8;
    --orange-600:#d9530a;
    --orange-500:#f2760c;
    --orange-100:#fdece0;
    --gray-50:#f7f8fa;
    --gray-100:#eef0f3;
    --gray-200:#e1e5eb;
    --gray-400:#9aa4b2;
    --gray-600:#5b6572;
    --gray-800:#2b323c;
    --white:#ffffff;
    --surface:#ffffff;
    --lvl0:#4c7a5e;
    --lvl0-bg:#e7f1eb;
    --lvl1:#b8860a;
    --lvl1-bg:#fbf1d9;
    --lvl2:#d9530a;
    --lvl2-bg:#fdece0;
    --lvl3:#b8271f;
    --lvl3-bg:#faeae9;
    --radius:14px;
    --shadow: 0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.08);
    --shadow-hover: 0 2px 4px rgba(11,37,69,.08), 0 12px 28px rgba(11,37,69,.14);
  }

  :root[data-theme="dark"]{
    --blue-900:#dce6f6;
    --blue-800:#c7d9f0;
    --blue-700:#8fb8e6;
    --blue-600:#6fa8dc;
    --blue-100:#152238;
    --orange-600:#ff9257;
    --orange-500:#f2760c;
    --orange-100:#2e1c10;
    --gray-50:#0a1220;
    --gray-100:#1a2540;
    --gray-200:#2a3752;
    --gray-400:#64748b;
    --gray-600:#a3b0c2;
    --gray-800:#e8ecf3;
    --surface:#121b2e;
    --lvl0:#7fc79a;
    --lvl0-bg:#132a1e;
    --lvl1:#e6c065;
    --lvl1-bg:#2b2412;
    --lvl2:#ff9257;
    --lvl2-bg:#2e1c10;
    --lvl3:#f2867c;
    --lvl3-bg:#2c1615;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
    --shadow-hover: 0 2px 6px rgba(0,0,0,.55), 0 16px 32px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  svg{ fill:none; stroke:currentColor; }
  html{ color-scheme: light; }
  html[data-theme="dark"]{ color-scheme: dark; }
  body{
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    min-height:100vh;
    overflow-x: hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  .topbar{
    background: linear-gradient(135deg, var(--brand-navy-1), var(--brand-navy-2));
    color: var(--white);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    row-gap:10px;
    gap:16px;
    position: sticky;
    top:0;
    z-index: 20;
    box-shadow: 0 2px 10px rgba(11,37,69,.25);
  }
  .topbar-left{ display:flex; align-items:center; gap:16px; min-width:0; }
  .topbar .sedec-logo{
    height:52px; width:auto; display:block; flex-shrink:0;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.3));
  }
  .topbar-text .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color: #ffd9b8; opacity:.95; font-weight:600;
  }
  .topbar-text h1{
    font-size:16px; margin:2px 0 0; font-weight:700; letter-spacing:.01em;
  }
  .topbar-note{
    font-size:10px; line-height:1.35; font-weight:400;
    color: rgba(255,255,255,.5); margin-top:4px; max-width:520px;
  }

  .topbar-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .gov-id{
    display:flex; align-items:center; gap:7px;
    color: rgba(255,255,255,.85); font-size:11.5px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
  }
  .gov-id .full{ font-weight:500; color: rgba(255,255,255,.55); }
  .committee-chip{
    background: var(--white); border-radius:10px; padding:4px 10px;
    display:flex; align-items:center; flex-shrink:0;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .committee-chip .committee-logo{ height:22px; width:auto; display:block; }
  .divider{ width:1px; height:22px; background: rgba(255,255,255,.25); flex-shrink:0; }

  .theme-toggle{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    color: var(--white); cursor:pointer; padding:0;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{ background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.5); }
  .theme-toggle svg{ width:15px;height:15px; stroke:currentColor; }
  .breadcrumb{
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px 0;
    font-size:13px;
    color: var(--gray-600);
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  }
  .breadcrumb .crumb{cursor:pointer; color:var(--blue-600);}
  .breadcrumb .crumb:hover{text-decoration:underline;}
  .breadcrumb .crumb.current{color:var(--gray-800); font-weight:600; cursor:default;}
  .breadcrumb .crumb.current:hover{text-decoration:none;}
  .breadcrumb .sep{color:var(--gray-400);}

  .backbar{
    max-width: 980px;
    margin: 10px auto 0;
    padding: 0 24px;
  }
  /* Na tela inicial não há para onde voltar nem trilha a mostrar — some com a faixa para não sobrar espaço vazio. */
  body.at-home .breadcrumb, body.at-home .backbar{ display:none; }
  .backbtn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--surface);
    border: 1px solid var(--gray-200);
    color: var(--blue-700);
    font-weight:600;
    font-size:13.5px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
  }
  .backbtn:hover{ background: var(--blue-100); border-color:var(--blue-600); }
  .backbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
  .backbtn:disabled{opacity:0; pointer-events:none;}

  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 24px 64px;
  }
  .screen{ display:none; animation: fadein .25s ease; }
  .screen.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .hero{
    text-align:center;
    padding: 18px 10px 4px;
    position: relative;
  }
  .hero::before{
    content:"";
    position:absolute; top:0; left:50%;
    width:100vw; transform: translateX(-50%);
    height:150px;
    background:
      radial-gradient(ellipse 42% 100% at 22% 35%, rgba(242,118,12,.16), transparent 75%),
      radial-gradient(ellipse 42% 100% at 78% 35%, rgba(28,84,144,.18), transparent 75%),
      linear-gradient(90deg, rgba(28,84,144,.05), rgba(242,118,12,.05));
    pointer-events:none; z-index:0;
  }
  .hero > *{ position:relative; z-index:1; }
  .hero .seal{
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--surface); border:1px solid var(--gray-200); border-radius:16px;
    padding:12px 26px; margin: 0 0 14px; box-shadow: var(--shadow);
  }
  .hero .seal img{ height:46px; width:auto; display:block; }
  .hero-accent{
    width:56px; height:4px; border-radius:4px; margin:0 auto 10px;
    background: linear-gradient(90deg, var(--orange-500), var(--brand-navy-2));
  }
  .hero-eyebrow{
    font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color: var(--gray-600); margin: 0 0 8px;
  }
  .hero h2{
    font-size: 27px; color: var(--blue-900); margin: 0 0 8px; font-weight:800;
    letter-spacing:-0.01em;
  }
  .hero p.sub{
    color: var(--gray-600); font-size:15px; max-width:700px; margin: 0 auto;
    line-height:1.55;
  }

  .section-title{
    font-size: 20px; color: var(--blue-900); font-weight:800; margin: 4px 0 4px;
  }
  .section-desc{ color: var(--gray-600); font-size:14.5px; line-height:1.6; margin: 0 0 22px; }
  .na-text{ color: var(--gray-600); font-style: italic; margin:0; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap:16px; margin-top: 18px;
  }
  .grid.tight{ grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); }

  .card{
    background: var(--surface);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 20px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:10px;
    text-align:left;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--blue-600); }
  .card .icon{
    width:42px;height:42px;border-radius:11px;
    background: var(--blue-100); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
  }
  .card .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .card.orange .icon{ background: var(--orange-100); color: var(--orange-600); }
  .card h3{ margin:0; font-size:15.5px; color:var(--blue-900); font-weight:700; line-height:1.35; }
  .card p{ margin:0; font-size:13px; color:var(--gray-600); line-height:1.5; }
  .card .go{
    margin-top:auto; display:flex; align-items:center; gap:5px;
    color: var(--blue-600); font-size:12.5px; font-weight:700;
  }
  .card .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}

  .card.disabled{ cursor:default; }
  .card.disabled:hover{ transform:none; box-shadow:var(--shadow); border-color:var(--gray-200); }
  .card.disabled .icon{ background: var(--gray-100); color: var(--gray-400); }
  .card.disabled h3{ color: var(--gray-600); }
  .badge-soon{
    margin-top:auto; display:inline-flex; align-items:center; width:fit-content;
    background: var(--gray-100); color: var(--gray-600);
    font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px;
  }
  .badge-soon.inline{ margin-top:0; flex-shrink:0; }

  .lawlist, .anexolist{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .lawitem, .anexoitem{
    display:flex; gap:13px; align-items:flex-start;
    background: var(--surface); border:1px solid var(--gray-200); border-radius:12px;
    padding:14px 16px; box-shadow: var(--shadow);
  }
  .lawitem .num, .anexoitem .num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background: var(--blue-100); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:11.5px;
  }
  .lawitem p, .anexoitem p{ margin:0; font-size:14px; line-height:1.55; color:var(--gray-800); }
  .lawitem strong{ color:var(--blue-900); }
  .law-link{
    display:inline-flex; align-items:baseline; gap:4px;
    color:inherit; text-decoration:none;
  }
  .law-link strong{ color:var(--blue-700); text-decoration:underline; text-decoration-color:var(--gray-200); text-underline-offset:2px; }
  .law-link:hover strong{ color:var(--blue-600); text-decoration-color:var(--blue-600); }
  .law-link svg{ width:11px; height:11px; stroke:var(--blue-600); flex-shrink:0; position:relative; top:1.5px; }
  .anexoitem{ align-items:center; }
  .anexoitem .anexo-title{ flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--blue-900); }
  .anexo-actions{ display:flex; gap:8px; flex-shrink:0; }
  .anexo-btn{
    display:inline-flex; align-items:center; gap:5px;
    background: var(--blue-100); color: var(--blue-700); text-decoration:none;
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:6px 12px; border-radius:8px; border:1px solid transparent;
    appearance:none; cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .anexo-btn:hover{ background: var(--blue-600); color: var(--white); }
  .anexo-btn svg{ width:13px; height:13px; stroke:currentColor; fill:none; flex-shrink:0; }
  .anexoitem.referencia{
    background: var(--blue-100); border-color: var(--blue-600); cursor:pointer;
  }
  .anexoitem.referencia:hover{ border-color: var(--blue-700); }
  .anexoitem.referencia .num{ background: var(--blue-600); color: var(--white); }
  .anexoitem.referencia .num svg{ width:14px; height:14px; stroke:currentColor; fill:none; }
  .anexoitem.siglas{
    background: var(--orange-100); border-color: var(--orange-600); cursor:pointer;
  }
  .anexoitem.siglas:hover{ border-color: var(--orange-500); }
  .anexoitem.siglas .num{ background: var(--orange-600); color: var(--white); }
  .anexoitem.siglas .num svg{ width:14px; height:14px; stroke:currentColor; fill:none; }
  @media (max-width:520px){
    .anexoitem{ flex-wrap:wrap; }
    .anexo-actions{ width:calc(100% - 39px); margin-left:39px; }
  }

  .home-card{ padding:26px 20px; }
  .home-card .icon{ width:52px;height:52px;border-radius:13px; }
  .home-card .icon svg{width:26px;height:26px;}
  .home-card h3{ font-size:16.5px; }

  .macro-divider{
    display:flex; align-items:center; gap:14px;
    margin: 30px 0 16px; color: var(--gray-400);
    font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  }
  .macro-divider::before, .macro-divider::after{
    content:""; flex:1; height:1px; background: var(--gray-200);
  }
  .macro-link{
    display:flex; align-items:center; gap:16px;
    background: var(--gray-100); border: 1px dashed var(--gray-200);
    border-radius: var(--radius); padding: 16px 20px;
    cursor:pointer; transition: border-color .15s ease, background-color .15s ease;
  }
  .macro-link:hover{ border-color: var(--blue-600); background: var(--blue-100); }
  .macro-link .icon{
    width:42px;height:42px;border-radius:11px; flex-shrink:0;
    background: var(--surface); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .macro-link .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .macro-link .macro-text{ flex:1; min-width:0; }
  .macro-link h3{ margin:0 0 2px; font-size:15px; color:var(--blue-900); font-weight:700; }
  .macro-link p{ margin:0; font-size:12.5px; color:var(--gray-600); line-height:1.45; }
  .macro-link .go{
    flex-shrink:0; display:flex; align-items:center; gap:5px;
    color: var(--blue-600); font-size:12.5px; font-weight:700;
  }
  .macro-link .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}
  @media (max-width:640px){
    .macro-link{ flex-wrap:wrap; }
    .macro-link .go{ margin-left:58px; }
  }

  .axr-highlight{
    display:flex; align-items:center; gap:16px;
    background: var(--orange-100); border: 1.5px solid var(--orange-500);
    border-radius: var(--radius); padding: 16px 20px; margin-top:12px;
    cursor:pointer; transition: filter .15s ease;
  }
  .axr-highlight:hover{ filter: brightness(0.97); }
  .axr-highlight .icon{
    width:42px;height:42px;border-radius:11px; flex-shrink:0;
    background: var(--orange-500); color: var(--white);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .axr-highlight .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .axr-highlight .macro-text{ flex:1; min-width:0; }
  .axr-highlight h3{ margin:0 0 2px; font-size:15px; color:var(--orange-600); font-weight:800; }
  .axr-highlight p{ margin:0; font-size:12.5px; color:var(--gray-600); line-height:1.45; }
  .axr-highlight .go{
    flex-shrink:0; display:flex; align-items:center; gap:5px;
    color: var(--orange-600); font-size:12.5px; font-weight:700;
  }
  .axr-highlight .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}
  @media (max-width:640px){
    .axr-highlight{ flex-wrap:wrap; }
    .axr-highlight .go{ margin-left:58px; }
  }

  .axr-legend{ display:flex; flex-wrap:wrap; gap:10px 20px; margin:0 0 18px; }
  .axr-legend-item{ font-size:12.5px; color:var(--gray-600); display:flex; align-items:center; gap:6px; }
  .axr-legend-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:20px; padding:0 6px; border-radius:999px;
    font-size:11px; font-weight:800;
  }
  .axr-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .axr-item{ background:var(--surface); border:1px solid var(--gray-200); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .axr-item-head{ display:flex; gap:12px; align-items:flex-start; margin-bottom:10px; }
  .axr-item-head .num{
    flex-shrink:0; width:24px;height:24px;border-radius:50%;
    background:var(--blue-100); color:var(--blue-700);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:11px;
  }
  .axr-item-head p{ margin:0; font-size:14px; line-height:1.55; color:var(--gray-800); }
  .axr-roles{ display:flex; flex-wrap:wrap; gap:6px; margin-left:36px; }
  .axr-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600;
    padding:4px 9px; border-radius:999px; cursor:pointer; border:1px solid transparent;
    transition: filter .15s ease; background:none; font-family:inherit; appearance:none;
  }
  .axr-chip:hover{ filter:brightness(0.93); }
  .axr-chip b{ font-weight:800; }
  .axr-chip.papel-rp{ background:var(--blue-600); color:var(--white); }
  .axr-chip.papel-r{ background:var(--blue-100); color:var(--blue-700); }
  .axr-chip.papel-a{ background:var(--gray-100); color:var(--gray-600); }
  .axr-legend-badge.papel-rp{ background:var(--blue-600); color:var(--white); }
  .axr-legend-badge.papel-r{ background:var(--blue-100); color:var(--blue-700); }
  .axr-legend-badge.papel-a{ background:var(--gray-100); color:var(--gray-600); }

  .axr-title-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .axr-title-row .section-title{ margin:4px 0; }
  .axr-visual-btn{
    display:inline-flex; align-items:center; gap:7px;
    background: #b8271f; color: #ffffff; border:none;
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 16px; border-radius:999px; cursor:pointer;
    box-shadow: var(--shadow); transition: filter .15s ease;
    white-space:nowrap;
  }
  .axr-visual-btn:hover{ filter:brightness(1.12); }
  .axr-visual-btn svg{ width:15px;height:15px; stroke:currentColor; fill:none; }

  .axr-visual-overlay{
    position:fixed; inset:0; z-index:200; background:var(--gray-50);
    display:flex; flex-direction:column;
  }
  .axr-visual-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; background:var(--brand-navy-1); color:var(--white);
    flex-shrink:0; box-shadow: var(--shadow);
  }
  .axr-visual-header h2{ margin:0; font-size:16px; font-weight:800; }
  .axr-visual-header p{ margin:2px 0 0; font-size:12px; color:#c9d7ec; }
  .axr-visual-close{
    display:inline-flex; align-items:center; gap:6px;
    background: rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35);
    color:var(--white); font-family:inherit; font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer; flex-shrink:0;
    transition: background-color .15s ease;
  }
  .axr-visual-close:hover{ background: rgba(255,255,255,.26); }
  .axr-visual-close svg{ width:14px;height:14px; stroke:currentColor; fill:none; }

  .axr-visual-scroll{ flex:1; overflow:auto; padding:0; background:var(--surface); }
  .axr-visual-table{
    border-collapse:separate; border-spacing:0; font-size:11.5px;
    table-layout:fixed; width:1px; /* col widths below drive the real width */
  }
  .axr-visual-table th, .axr-visual-table td{
    border-right:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200);
    padding:4px 6px; background:var(--surface); overflow:hidden;
  }
  .axr-visual-table thead th{
    position:sticky; top:0; z-index:3; background:var(--brand-navy-2); color:var(--white);
    font-weight:700; text-align:center; border-color: var(--brand-navy-2);
  }

/* ===== PLANCON IF — extensões (6 níveis de resposta e componentes novos) ===== */
:root{
  --lvl0:#3f7a55; --lvl0-bg:#e6f1ea;
  --lvl1:#5f7d12; --lvl1-bg:#eef4dc;
  --lvl2:#a87a00; --lvl2-bg:#fbf1d6;
  --lvl3:#d9530a; --lvl3-bg:#fdece0;
  --lvl4:#b8271f; --lvl4-bg:#faeae9;
  --lvl5:#7a1d4f; --lvl5-bg:#f6e6ef;
}
:root[data-theme="dark"]{
  --lvl0:#7fc79a; --lvl0-bg:rgba(127,199,154,.14);
  --lvl1:#b9d36a; --lvl1-bg:rgba(185,211,106,.14);
  --lvl2:#f0c45a; --lvl2-bg:rgba(240,196,90,.14);
  --lvl3:#ff9a5a; --lvl3-bg:rgba(255,154,90,.15);
  --lvl4:#ff7a70; --lvl4-bg:rgba(255,122,112,.15);
  --lvl5:#e48ac0; --lvl5-bg:rgba(228,138,192,.15);
}
.lvl-card[data-lvl="4"]{ border-left-color: var(--lvl4); }
.lvl-card[data-lvl="5"]{ border-left-color: var(--lvl5); }
.lvl-pill[data-lvl="4"]{ background:var(--lvl4-bg); color:var(--lvl4); }
.lvl-pill[data-lvl="5"]{ background:var(--lvl5-bg); color:var(--lvl5); }
.lvl-banner[data-lvl="4"]{ background:var(--lvl4-bg); }
.lvl-banner[data-lvl="5"]{ background:var(--lvl5-bg); }
.lvl-banner{ border-left:5px solid transparent; }
.lvl-banner[data-lvl="0"]{border-left-color:var(--lvl0)} .lvl-banner[data-lvl="1"]{border-left-color:var(--lvl1)}
.lvl-banner[data-lvl="2"]{border-left-color:var(--lvl2)} .lvl-banner[data-lvl="3"]{border-left-color:var(--lvl3)}
.lvl-banner[data-lvl="4"]{border-left-color:var(--lvl4)} .lvl-banner[data-lvl="5"]{border-left-color:var(--lvl5)}
.lvl-banner.compact{ display:flex; align-items:center; gap:12px; padding:10px 16px; margin:22px 0 10px; }
.lvl-banner.compact h3{ margin:0; font-size:16px; }
.lvl-card .lvl-pill{ margin-bottom:8px; display:inline-block; }
.card .tags{ margin-top:6px; } .card .tags .lvl-pill{ margin:0; }
.muted{ color:var(--gray-600); font-size:13.5px; }
.tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag{ font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--blue-100); color:var(--blue-700); }
.grid.two{ grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.card.concept{ cursor:default; } .card.concept:hover{ transform:none; }
.card.concept .icon{ background:var(--orange-100); color:var(--orange-600); }
.card.concept h3{ color:inherit; } .card.concept p{ font-size:14px; line-height:1.55; }
.nr-meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
.indlist{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.ind{ display:flex; gap:12px; align-items:flex-start; line-height:1.5; }
.ind-n{ flex:0 0 auto; min-width:34px; text-align:center; font-weight:700; font-size:12px; padding:3px 6px; border-radius:6px; background:var(--gray-100); color:var(--blue-700); }
.ind-n.cod{ min-width:78px; font-variant-numeric:tabular-nums; }
.acoes-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
.acao-bloco{ background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.acao-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:11px 16px; background:var(--blue-100); cursor:pointer; }

.nr-scale{ display:grid; grid-template-columns:1fr 1fr; gap:0; margin:16px 0; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.nr-scale-part{ padding:14px 18px; background:linear-gradient(90deg,var(--lvl0-bg),var(--lvl2-bg)); }

.fig{ margin:18px 0; background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); }
.fig img{ display:block; max-width:100%; height:auto; margin:0 auto; cursor:zoom-in; }
.fig figcaption{ font-size:13px; color:#5b6572; margin-top:8px; text-align:center; } .fig-hint{ opacity:.7; }
.figzoom{ margin:auto; max-width:96vw; max-height:94vh; text-align:center; cursor:zoom-out; }

.siglas{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px 20px; }
.siglas div{ display:flex; gap:10px; font-size:14px; line-height:1.4; } .siglas b{ min-width:110px; color:var(--blue-700); }
.axr-cat{ font-size:11px; font-weight:700; text-align:center; background:var(--blue-100); color:var(--blue-700); padding:6px 4px; border:1px solid var(--gray-200); }
@media (max-width:640px){ .nm-scale{ grid-template-columns:1fr; } .nr-scale{ grid-template-columns:1fr; } .acoes-grid{ grid-template-columns:1fr; } }
.axr-visual-table thead tr.axr-visual-org-row th{ height:132px; max-height:132px; cursor:default; }
.axr-visual-table thead tr.axr-visual-org-row th span{ max-height:126px; white-space:normal; line-height:1.15; }

function applyTheme(mode){
  currentTheme = mode;
  document.documentElement.setAttribute('data-theme', mode);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.innerHTML = icon(mode === 'dark' ? 'sun' : 'moon');
}
function toggleTheme(){ applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

SCREENS.produtos = { crumb:"Outros produtos", render: () => `
  <div class="section-title">Outros produtos</div>
  <p class="section-desc">Sites, painéis e dashboards desenvolvidos para a gestão de riscos e desastres no Estado do Rio de Janeiro. Os links abrem em nova aba.</p>
  ${PRODUTOS.map(gr=>`
    <div class="macro-divider">${gr.g}</div>
    <div class="prod-grid ${gr.wide?'wide':''} ${gr.cls?'g-'+gr.cls:''}">${gr.itens.map(([t,d,u,atual,ic])=>`
      <a class="prod ${atual?'atual':''}" href="${u}" target="_blank" rel="noopener">
        ${gr.logo?`<img class="prod-logo" src="${FIGS[gr.logo]}" alt="Força Especializada SEDEC-RJ">`:`<span class="prod-ic">${icon(ic||gr.icon)}</span>`}
        <span class="prod-tx"><strong>${t}</strong>${d?`<span>${d}</span>`:''}</span>
        <span class="prod-go">${atual?'<em>você está aqui</em>':icon('external')}</span>
      </a>`).join('')}</div>`).join('')}
`};

PRODUTOS.forEach(g => g.itens.forEach(it => { if (it[3]) { it[1] = 'Plano prático'; it[3] = false; } }));
document.getElementById('main').innerHTML = '<div class="screen active">' + SCREENS.produtos.render()
  .replace('<div class="section-title">Outros produtos</div>','<div class="section-title">Produtos SEDEC-RJ</div>') + '</div>';
</script>
